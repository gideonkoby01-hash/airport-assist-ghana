# Local Supabase development settings (supabase start). Production is configured in the Supabase
# dashboard with the same values; see MIGRATION.md.
project_id = "airport-assist-ghana"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password", "http://localhost:5173/portal"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# Registration asks for the 6-digit code from this email (see supabase/templates/confirmation.html).
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Your Airport Assist Ghana verification code"
content_path = "./supabase/templates/confirmation.html"

# Authenticator-app (TOTP) two-step verification.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

# Called by the database scheduler with a shared secret, not by a signed-in user.
[functions.purgeIdPhotos]
verify_jwt = false
