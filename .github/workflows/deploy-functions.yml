# Deploys the Edge Functions to Supabase whenever a function changes on main, or when you press
# "Run workflow" on the Actions tab. Needs two repository secrets (see MIGRATION.md, "Automatic function deployment"):
#   SUPABASE_ACCESS_TOKEN   a personal access token from Supabase (Account > Access Tokens)
#   SUPABASE_PROJECT_REF    the part of your Supabase address before ".supabase.co"
# Database changes are NOT deployed from here: run new files from supabase/migrations in the Supabase SQL Editor.
name: Deploy functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

# One deploy at a time; a second one waits instead of cancelling the first halfway.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the two secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Never deploy code that does not type-check.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every function
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "== $f"
            deno check "$f"
          done

      - name: Install the Supabase command line tool
        run: npm install --global supabase@3.1.0

      # Bundles on Supabase's side (no Docker needed) and deploys every function. verify_jwt settings come from supabase/config.toml.
      - name: Deploy every function
        run: supabase functions deploy --remote="$PROJECT_REF" --use-api --yes

      - name: Show what is deployed
        run: supabase functions list --remote="$PROJECT_REF"
